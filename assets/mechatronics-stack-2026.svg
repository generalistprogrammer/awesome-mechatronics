<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 764" width="1200" height="764" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t   { fill:#14161A; }
      .m   { fill:#5B6270; }
      .h1  { font-size:30px; font-weight:700; letter-spacing:-0.3px; }
      .h2  { font-size:15px; font-weight:400; }
      .lyr { font-size:17px; font-weight:650; }
      .ex  { font-size:12.5px; }
      .badge { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .cchead { font-size:13.5px; font-weight:700; }
      .ccbody { font-size:12.5px; }
      .foot { font-size:12px; }
      .kicker { font-size:11.5px; font-weight:700; letter-spacing:1.2px; }
    </style>
  </defs>

  <rect width="1200" height="764" fill="#FBFBFD"/>
  <rect x="0" y="0" width="1200" height="6" fill="#2B5CB8"/>
  <rect x="240" y="0" width="240" height="6" fill="#C2670E"/>
  <rect x="480" y="0" width="240" height="6" fill="#1E7A44"/>
  <rect x="720" y="0" width="240" height="6" fill="#7A3FC2"/>
  <rect x="960" y="0" width="240" height="6" fill="#B3306B"/>

  <text x="40" y="58" class="t h1">The Mechatronic Stack, 2026</text>
  <text x="40" y="86" class="m h2">Every layer is still mechatronics. What changed is that the top two layers are now learned, not written.</text>

  <!-- LAYER 7 -->
  <g>
    <rect x="40" y="112" width="800" height="74" rx="10" fill="#FDF0F6" stroke="#E9CADB"/>
    <rect x="40" y="112" width="5" height="74" rx="2.5" fill="#B3306B"/>
    <circle cx="72" cy="149" r="13" fill="#B3306B"/>
    <text x="72" y="153.5" text-anchor="middle" class="badge">7</text>
    <text x="98" y="144" class="t lyr">Supervision &amp; Orchestration</text>
    <text x="98" y="165" class="m ex">LLM agents · Model Context Protocol · MES / ERP · fleet scheduling · human-in-the-loop approval</text>
  </g>

  <!-- LAYER 6 -->
  <g>
    <rect x="40" y="194" width="800" height="74" rx="10" fill="#F5EDFD" stroke="#DCC9F0"/>
    <rect x="40" y="194" width="5" height="74" rx="2.5" fill="#7A3FC2"/>
    <circle cx="72" cy="231" r="13" fill="#7A3FC2"/>
    <text x="72" y="235.5" text-anchor="middle" class="badge">6</text>
    <text x="98" y="226" class="t lyr">Policy &amp; Autonomy  <tspan class="m ex" font-weight="400">— new since 2023</tspan></text>
    <text x="98" y="247" class="m ex">Behaviour cloning · action chunking · diffusion policy · flow matching · VLAs · world models</text>
  </g>

  <!-- LAYER 5 -->
  <g>
    <rect x="40" y="276" width="800" height="74" rx="10" fill="#E9F6EE" stroke="#C6E3D3"/>
    <rect x="40" y="276" width="5" height="74" rx="2.5" fill="#1E7A44"/>
    <circle cx="72" cy="313" r="13" fill="#1E7A44"/>
    <text x="72" y="317.5" text-anchor="middle" class="badge">5</text>
    <text x="98" y="308" class="t lyr">Control</text>
    <text x="98" y="329" class="m ex">PID · state feedback / LQR · observers &amp; Kalman filtering · MPC / NMPC · impedance control</text>
  </g>

  <!-- LAYER 4 -->
  <g>
    <rect x="40" y="358" width="800" height="74" rx="10" fill="#E9F6EE" stroke="#C6E3D3"/>
    <rect x="40" y="358" width="5" height="74" rx="2.5" fill="#1E7A44"/>
    <circle cx="72" cy="395" r="13" fill="#1E7A44"/>
    <text x="72" y="399.5" text-anchor="middle" class="badge">4</text>
    <text x="98" y="390" class="t lyr">Real-Time Compute &amp; Communication</text>
    <text x="98" y="411" class="m ex">MCU + RTOS (Zephyr / FreeRTOS) · micro-ROS · ROS 2 · EtherCAT · CAN-FD · TSN · OPC UA</text>
  </g>

  <!-- LAYER 3 -->
  <g>
    <rect x="40" y="440" width="800" height="74" rx="10" fill="#FDF4E9" stroke="#F0DCC0"/>
    <rect x="40" y="440" width="5" height="74" rx="2.5" fill="#C2670E"/>
    <circle cx="72" cy="477" r="13" fill="#C2670E"/>
    <text x="72" y="481.5" text-anchor="middle" class="badge">3</text>
    <text x="98" y="472" class="t lyr">Sensing &amp; Signal Conditioning</text>
    <text x="98" y="493" class="m ex">Encoders (motor- vs output-side) · IMU · force/torque · tactile · RGB-D · lidar · latency</text>
  </g>

  <!-- LAYER 2 -->
  <g>
    <rect x="40" y="522" width="800" height="74" rx="10" fill="#FDF4E9" stroke="#F0DCC0"/>
    <rect x="40" y="522" width="5" height="74" rx="2.5" fill="#C2670E"/>
    <circle cx="72" cy="559" r="13" fill="#C2670E"/>
    <text x="72" y="563.5" text-anchor="middle" class="badge">2</text>
    <text x="98" y="554" class="t lyr">Actuation &amp; Transmission</text>
    <text x="98" y="575" class="m ex">BLDC + FOC · harmonic / cycloidal / planetary · quasi-direct drive · series elastic · thermal</text>
  </g>

  <!-- LAYER 1 -->
  <g>
    <rect x="40" y="604" width="800" height="74" rx="10" fill="#EBF1FB" stroke="#C9D8F0"/>
    <rect x="40" y="604" width="5" height="74" rx="2.5" fill="#2B5CB8"/>
    <circle cx="72" cy="641" r="13" fill="#2B5CB8"/>
    <text x="72" y="645.5" text-anchor="middle" class="badge">1</text>
    <text x="98" y="636" class="t lyr">Mechanism &amp; Structure</text>
    <text x="98" y="657" class="m ex">Kinematic architecture · reflected inertia · stiffness &amp; resonance · backlash · tolerances</text>
  </g>

  <!-- CROSS-CUTTING COLUMN -->
  <g>
    <rect x="864" y="112" width="296" height="178" rx="10" fill="#FFFFFF" stroke="#D9DEE7"/>
    <rect x="864" y="112" width="296" height="30" rx="10" fill="#14161A"/>
    <rect x="864" y="132" width="296" height="10" fill="#14161A"/>
    <text x="882" y="132" class="cchead" fill="#FFFFFF">Safety &amp; Standards</text>
    <text x="882" y="166" class="m ccbody">ISO 13849 / IEC 62061 · SIL &amp; PL</text>
    <text x="882" y="188" class="m ccbody">ISO 10218 · ISO/TS 15066 (cobots)</text>
    <text x="882" y="210" class="m ccbody">EU Machinery Reg. 2023/1230</text>
    <text x="882" y="232" class="m ccbody">EU AI Act · NIST AI RMF</text>
    <text x="882" y="266" class="ccbody" fill="#B3306B" font-weight="700">The learned layers never sit</text>
    <text x="882" y="282" class="ccbody" fill="#B3306B" font-weight="700">inside the safety function.</text>
  </g>

  <g>
    <rect x="864" y="302" width="296" height="178" rx="10" fill="#FFFFFF" stroke="#D9DEE7"/>
    <rect x="864" y="302" width="296" height="30" rx="10" fill="#14161A"/>
    <rect x="864" y="322" width="296" height="10" fill="#14161A"/>
    <text x="882" y="322" class="cchead" fill="#FFFFFF">Simulation &amp; Digital Twin</text>
    <text x="882" y="356" class="m ccbody">Newton · MuJoCo Warp · Isaac Lab</text>
    <text x="882" y="378" class="m ccbody">Gazebo · Genesis · Drake</text>
    <text x="882" y="400" class="m ccbody">Asset Administration Shell</text>
    <text x="882" y="422" class="m ccbody">(IEC 63278-1) · OPC UA models</text>
    <text x="882" y="456" class="ccbody" fill="#1E7A44" font-weight="700">GPU physics turned simulation</text>
    <text x="882" y="472" class="ccbody" fill="#1E7A44" font-weight="700">into a design tool, not a demo.</text>
  </g>

  <g>
    <rect x="864" y="492" width="296" height="186" rx="10" fill="#FFFFFF" stroke="#D9DEE7"/>
    <rect x="864" y="492" width="296" height="30" rx="10" fill="#14161A"/>
    <rect x="864" y="512" width="296" height="10" fill="#14161A"/>
    <text x="882" y="512" class="cchead" fill="#FFFFFF">Data &amp; the Learning Loop</text>
    <text x="882" y="546" class="m ccbody">Teleoperation · UMI handheld rigs</text>
    <text x="882" y="568" class="m ccbody">Open X-Embodiment · DROID</text>
    <text x="882" y="590" class="m ccbody">Synthetic data from world models</text>
    <text x="882" y="612" class="m ccbody">Evaluation: LIBERO · SimplerEnv</text>
    <text x="882" y="646" class="ccbody" fill="#7A3FC2" font-weight="700">The 2026 bottleneck is data</text>
    <text x="882" y="662" class="ccbody" fill="#7A3FC2" font-weight="700">infrastructure, not architecture.</text>
  </g>

  <line x1="40" y1="702" x2="1160" y2="702" stroke="#E3E7EE"/>
  <text x="40" y="726" class="m foot">Layers 1–5 are the classical mechatronic V-model. Layers 6–7 are what the last five years added.</text>
  <text x="40" y="746" class="m foot">awesome-mechatronics · diagram is CC0 — reuse and edit freely</text>
</svg>
